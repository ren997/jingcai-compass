name: Backend PostgreSQL Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "docs/dev-tasks.md"
      - ".github/workflows/backend-integration.yml"
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - "docs/dev-tasks.md"
      - ".github/workflows/backend-integration.yml"

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Show tool versions
        run: |
          java -version
          mvn -version
          docker version

      - name: Run unit and PostgreSQL integration tests
        run: mvn -B -ntp -f backend/pom.xml -Pintegration verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          if-no-files-found: ignore
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
