# Copy to application-local.yml (git-ignored) and fill in cloud/dev credentials.
# Default profile is local; Spring Boot loads this overlay automatically.

spring:
  datasource:
    url: jdbc:postgresql://<cloud-host>:<port>/<database>
    username: <username>
    password: <password>
  data:
    redis:
      host: <cloud-host>
      port: <port>
      password: <password>

app:
  snapshot:
    storage:
      type: local
      path: ./runtime/snapshots
  security:
    # JWT_SECRET 必须是 Base64 编码的至少 32 字节随机值，禁止提交真实值。
    jwt:
      secret: <base64-jwt-secret>
      issuer: jingcai-compass
      audience: jingcai-compass-admin
      access-token-ttl: 30m
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    # 仅 admin_accounts 为空时创建第一位管理员；后续启动不会静默改密。
    bootstrap:
      username: <admin-username>
      password: <admin-password-at-least-12-characters>
  pagination:
    max-page-size: 100
  # 离线联调可将 sporttery/asian-odds.provider 都设为 stub（classpath:stub/** fixtures）
  sporttery:
    provider: china
    base-url: https://webapi.sporttery.cn
    connect-timeout: 5s
    read-timeout: 10s
    retry:
      max-attempts: 2
      delay: 500ms
    quota-warning-threshold: 0
  asian-odds:
    # stub | THE_ODDS_API（THE_ODDS_API 时装配带超时的 RestClient，业务适配后续任务）
    provider: stub
    base-url: https://api.the-odds-api.com
    api-key: <api-key>
    connect-timeout: 5s
    read-timeout: 10s
    retry:
      max-attempts: 2
      delay: 500ms
    quota-warning-threshold: 0
    # 跨庄聚合：白名单按线判定（该线白名单家数 >= min-whitelist-bookmakers 才用白名单样本），
    # 否则该线回退全量中位数；单线报价家数 < min-bookmakers 的线不参与主盘选择。
    aggregation:
      bookmaker-whitelist: pinnacle,matchbook,betfair
      min-bookmakers: 2
      min-whitelist-bookmakers: 2
  # λ 反解：邻线容差由 3 场真实抓包的最大偏差 3.508% 标定；
  # max-goals 由 λ 总和最大 8.0 时的截断尾部质量标定（16 → 3.7e-3，24 → 1.2e-6）。
  asian-model:
    neighbor-tolerance: 0.0400
    residual-tolerance: 0.0010
    max-goals: 24
    # 跨庄分歧上限：实测让球主盘 σ 为 0.002~0.012，全部档位最大 0.0325。
    dispersion-tolerance: 0.0200
    # 影子门槛的安全边际：本阶段只记录不拦截，故不影响发布量。
    safety-margin: 0.0100
  tasks:
    enabled: false
    sporttery-pool:
      enabled: false
      fixed-delay: 15m
      initial-delay: 30s
    asian-odds:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    # 开启整链路时，sporttery-pool/asian-odds 两个独立任务必须保持关闭。
    data-pipeline:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    prediction-lock:
      enabled: false
      fixed-delay: 30s
      initial-delay: 15s
      batch-size: 100
    snapshot-publish:
      enabled: false
      fixed-delay: 5m
      initial-delay: 60s
