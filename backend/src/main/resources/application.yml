spring:
  application:
    name: jingcai-compass-backend
  profiles:
    active: local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    address: ${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:jingcai-compass}
      audience: ${JWT_AUDIENCE:jingcai-compass-admin}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    login:
      max-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${ADMIN_LOCK_DURATION:15m}
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  pagination:
    max-page-size: ${MAX_PAGE_SIZE:100}
  snapshot:
    storage:
      type: ${SNAPSHOT_STORAGE_TYPE:local}
      path: ${SNAPSHOT_STORAGE_PATH:./runtime/snapshots}
  sporttery:
    provider: ${SPORTTERY_PROVIDER:china}
    base-url: ${SPORTTERY_BASE_URL:https://webapi.sporttery.cn}
    connect-timeout: ${SPORTTERY_CONNECT_TIMEOUT:5s}
    read-timeout: ${SPORTTERY_READ_TIMEOUT:10s}
    retry:
      max-attempts: ${SPORTTERY_RETRY_MAX_ATTEMPTS:2}
      delay: ${SPORTTERY_RETRY_DELAY:500ms}
    quota-warning-threshold: ${SPORTTERY_QUOTA_WARNING_THRESHOLD:0}
  asian-odds:
    provider: ${ASIAN_ODDS_PROVIDER:stub}
    base-url: ${ASIAN_ODDS_BASE_URL:https://api.the-odds-api.com}
    api-key: ${ASIAN_ODDS_API_KEY:}
    connect-timeout: ${ASIAN_ODDS_CONNECT_TIMEOUT:5s}
    read-timeout: ${ASIAN_ODDS_READ_TIMEOUT:10s}
    retry:
      max-attempts: ${ASIAN_ODDS_RETRY_MAX_ATTEMPTS:2}
      delay: ${ASIAN_ODDS_RETRY_DELAY:500ms}
    quota-warning-threshold: ${ASIAN_ODDS_QUOTA_WARNING_THRESHOLD:0}
  tasks:
    enabled: ${SYNC_TASKS_ENABLED:false}
    sporttery-pool:
      enabled: ${SPORTTERY_POOL_TASK_ENABLED:false}
      fixed-delay: ${SPORTTERY_POOL_FIXED_DELAY:15m}
      initial-delay: ${SPORTTERY_POOL_INITIAL_DELAY:30s}
    match-result:
      enabled: ${MATCH_RESULT_TASK_ENABLED:false}
      fixed-delay: ${MATCH_RESULT_FIXED_DELAY:15m}
      initial-delay: ${MATCH_RESULT_INITIAL_DELAY:60s}
      lookback-days: ${MATCH_RESULT_LOOKBACK_DAYS:7}
    asian-odds:
      enabled: ${ASIAN_ODDS_TASK_ENABLED:false}
      fixed-delay: ${ASIAN_ODDS_FIXED_DELAY:20m}
      initial-delay: ${ASIAN_ODDS_INITIAL_DELAY:45s}
    data-pipeline:
      enabled: ${DATA_PIPELINE_TASK_ENABLED:false}
      fixed-delay: ${DATA_PIPELINE_FIXED_DELAY:20m}
      initial-delay: ${DATA_PIPELINE_INITIAL_DELAY:45s}
    prediction-lock:
      enabled: ${PREDICTION_LOCK_TASK_ENABLED:false}
      fixed-delay: ${PREDICTION_LOCK_FIXED_DELAY:30s}
      initial-delay: ${PREDICTION_LOCK_INITIAL_DELAY:15s}
      batch-size: ${PREDICTION_LOCK_BATCH_SIZE:100}
    snapshot-publish:
      enabled: ${SNAPSHOT_PUBLISH_TASK_ENABLED:false}
      fixed-delay: ${SNAPSHOT_PUBLISH_FIXED_DELAY:5m}
      initial-delay: ${SNAPSHOT_PUBLISH_INITIAL_DELAY:60s}
    settlement:
      enabled: ${SETTLEMENT_TASK_ENABLED:false}
      fixed-delay: ${SETTLEMENT_FIXED_DELAY:5m}
      initial-delay: ${SETTLEMENT_INITIAL_DELAY:75s}
      batch-size: ${SETTLEMENT_BATCH_SIZE:100}
  observability:
    enabled: ${OBSERVABILITY_ENABLED:true}
    refresh-delay: ${OBSERVABILITY_REFRESH_DELAY:1m}
    sporttery-max-sync-age: ${SPORTTERY_MAX_SYNC_AGE:30m}
    asian-odds-max-sync-age: ${ASIAN_ODDS_MAX_SYNC_AGE:40m}
    coverage-minimum-rate: ${ASIAN_ODDS_COVERAGE_MINIMUM_RATE:0.90}
    failed-run-streak-threshold: ${SYNC_FAILED_RUN_STREAK_THRESHOLD:3}
    pending-mapping-threshold: ${PENDING_MAPPING_THRESHOLD:20}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
