spring:
  application:
    name: jingcai-compass-backend
  profiles:
    active: local
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    address: ${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER:jingcai-compass}
      audience: ${JWT_AUDIENCE:jingcai-compass-admin}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    login:
      max-failed-attempts: ${ADMIN_MAX_FAILED_ATTEMPTS:5}
      lock-duration: ${ADMIN_LOCK_DURATION:15m}
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  pagination:
    max-page-size: ${MAX_PAGE_SIZE:100}
  snapshot:
    storage:
      type: ${SNAPSHOT_STORAGE_TYPE:local}
      path: ${SNAPSHOT_STORAGE_PATH:./runtime/snapshots}
  # nova | stub。体彩官网（china）已随单源改造删除，配错会在启动期绑定失败。
  # 连接超时、重试、base-url 统一在下面的 app.nova，赛程/赔率/赛果共用一个客户端。
  sporttery:
    provider: ${SPORTTERY_PROVIDER:nova}
    quota-warning-threshold: ${SPORTTERY_QUOTA_WARNING_THRESHOLD:0}
  # NovaAPI：赛程、赔率、赛果共用同一个 matchId 的单源数据源。
  # api-key / private-key 无默认值：缺失时只在真正发起请求的那一刻报错，
  # 而不是让 provider=stub 的部署因为缺凭据启动失败。
  nova:
    base-url: ${NOVA_BASE_URL:https://novaapi.tsgnkj.com}
    api-key: ${NOVA_API_KEY:}
    private-key: ${NOVA_PRIVATE_KEY:}
    connect-timeout: ${NOVA_CONNECT_TIMEOUT:5s}
    # 单次 /nova/tf/odds 要返回几十家机构的全部玩法，比体彩单接口重得多。
    read-timeout: ${NOVA_READ_TIMEOUT:20s}
    retry:
      max-attempts: ${NOVA_RETRY_MAX_ATTEMPTS:2}
      delay: ${NOVA_RETRY_DELAY:500ms}
    quota-warning-threshold: ${NOVA_QUOTA_WARNING_THRESHOLD:0}
  asian-odds:
    # stub | NOVA_API。凭据、限速、超时与重试统一在 app.nova 下——
    # 赛程与赔率共用同一个额度桶，分两处配会让「额度被谁用掉」算不清。
    provider: ${ASIAN_ODDS_PROVIDER:stub}
    quota-warning-threshold: ${ASIAN_ODDS_QUOTA_WARNING_THRESHOLD:0}
    # 跨庄聚合范围：低抽水白名单按线判定，家数不足回退全量中位数。
    aggregation:
      bookmaker-whitelist: ${ASIAN_ODDS_AGGREGATION_BOOKMAKER_WHITELIST:pinnacle,matchbook,betfair}
      min-bookmakers: ${ASIAN_ODDS_AGGREGATION_MIN_BOOKMAKERS:2}
      min-whitelist-bookmakers: ${ASIAN_ODDS_AGGREGATION_MIN_WHITELIST_BOOKMAKERS:2}
  # λ 反解：搜索域与解法固化在代码里（属模型定义），这里只放数据质量阈值与精度旋钮。
  asian-model:
    neighbor-tolerance: ${ASIAN_MODEL_NEIGHBOR_TOLERANCE:0.0400}
    residual-tolerance: ${ASIAN_MODEL_RESIDUAL_TOLERANCE:0.0010}
    max-goals: ${ASIAN_MODEL_MAX_GOALS:24}
    # 跨庄分歧上限：超过则只砍该市场的方向，两个市场都超限才整场跳过。
    dispersion-tolerance: ${ASIAN_MODEL_DISPERSION_TOLERANCE:0.0200}
    # 影子门槛的安全边际：required = 1/冻结报价 + 本值。本阶段只记录不拦截。
    safety-margin: ${ASIAN_MODEL_SAFETY_MARGIN:0.0100}
    # 置信度阈值：margin 是抽水率（越平衡越大），所以此处是上限、越严越小；
    # signal 是两侧去水概率的归一化差距，此处是下限。默认值与原先硬编码常量逐字相等。
    high-confidence-margin: ${ASIAN_MODEL_HIGH_CONFIDENCE_MARGIN:0.1000}
    medium-confidence-margin: ${ASIAN_MODEL_MEDIUM_CONFIDENCE_MARGIN:0.1600}
    high-direction-signal: ${ASIAN_MODEL_HIGH_DIRECTION_SIGNAL:0.0750}
    medium-direction-signal: ${ASIAN_MODEL_MEDIUM_DIRECTION_SIGNAL:0.0250}
  tasks:
    enabled: ${SYNC_TASKS_ENABLED:false}
    sporttery-pool:
      enabled: ${SPORTTERY_POOL_TASK_ENABLED:false}
      fixed-delay: ${SPORTTERY_POOL_FIXED_DELAY:15m}
      initial-delay: ${SPORTTERY_POOL_INITIAL_DELAY:30s}
    match-result:
      enabled: ${MATCH_RESULT_TASK_ENABLED:false}
      fixed-delay: ${MATCH_RESULT_FIXED_DELAY:15m}
      initial-delay: ${MATCH_RESULT_INITIAL_DELAY:60s}
      lookback-days: ${MATCH_RESULT_LOOKBACK_DAYS:7}
    asian-odds:
      enabled: ${ASIAN_ODDS_TASK_ENABLED:false}
      fixed-delay: ${ASIAN_ODDS_FIXED_DELAY:20m}
      initial-delay: ${ASIAN_ODDS_INITIAL_DELAY:45s}
    data-pipeline:
      enabled: ${DATA_PIPELINE_TASK_ENABLED:false}
      fixed-delay: ${DATA_PIPELINE_FIXED_DELAY:20m}
      initial-delay: ${DATA_PIPELINE_INITIAL_DELAY:45s}
    prediction-lock:
      enabled: ${PREDICTION_LOCK_TASK_ENABLED:false}
      fixed-delay: ${PREDICTION_LOCK_FIXED_DELAY:30s}
      initial-delay: ${PREDICTION_LOCK_INITIAL_DELAY:15s}
      batch-size: ${PREDICTION_LOCK_BATCH_SIZE:100}
    snapshot-publish:
      enabled: ${SNAPSHOT_PUBLISH_TASK_ENABLED:false}
      fixed-delay: ${SNAPSHOT_PUBLISH_FIXED_DELAY:5m}
      initial-delay: ${SNAPSHOT_PUBLISH_INITIAL_DELAY:60s}
    settlement:
      enabled: ${SETTLEMENT_TASK_ENABLED:false}
      fixed-delay: ${SETTLEMENT_FIXED_DELAY:5m}
      initial-delay: ${SETTLEMENT_INITIAL_DELAY:75s}
      batch-size: ${SETTLEMENT_BATCH_SIZE:100}
    prediction-auto-publish:
      enabled: ${PREDICTION_AUTO_PUBLISH_TASK_ENABLED:false}
      fixed-delay: ${PREDICTION_AUTO_PUBLISH_FIXED_DELAY:15m}
      initial-delay: ${PREDICTION_AUTO_PUBLISH_INITIAL_DELAY:2m}
      # 生成不幂等（batchHash 含 generatedAt），间隔过小会持续产出同场 DRAFT。
      regenerate-interval: ${PREDICTION_AUTO_PUBLISH_REGENERATE_INTERVAL:3h}
      # 写入审计日志的操作者标识；发布服务拒绝空操作者。
      operator: "${PREDICTION_AUTO_PUBLISH_OPERATOR:system:auto-publish}"
  observability:
    enabled: ${OBSERVABILITY_ENABLED:true}
    refresh-delay: ${OBSERVABILITY_REFRESH_DELAY:1m}
    sporttery-max-sync-age: ${SPORTTERY_MAX_SYNC_AGE:30m}
    asian-odds-max-sync-age: ${ASIAN_ODDS_MAX_SYNC_AGE:40m}
    coverage-minimum-rate: ${ASIAN_ODDS_COVERAGE_MINIMUM_RATE:0.90}
    failed-run-streak-threshold: ${SYNC_FAILED_RUN_STREAK_THRESHOLD:3}
    prediction-lock-overdue-grace: ${PREDICTION_LOCK_OVERDUE_GRACE:1m}
    settlement-backlog-grace: ${SETTLEMENT_BACKLOG_GRACE:10m}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
