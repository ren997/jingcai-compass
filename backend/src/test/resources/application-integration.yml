spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    clean-disabled: true
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

app:
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: jingcai-compass
      audience: jingcai-compass-admin
      access-token-ttl: 30m
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    bootstrap:
      username: integration-admin
      password: integration-password-123
  sporttery:
    provider: stub
  asian-odds:
    provider: stub
  tasks:
    enabled: false
    sporttery-pool:
      enabled: false
      fixed-delay: 15m
      initial-delay: 30s
    asian-odds:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    data-pipeline:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    prediction-lock:
      enabled: false
      fixed-delay: 30s
      initial-delay: 15s
      batch-size: 100
