app:
  snapshot:
    storage:
      type: local
      path: ${java.io.tmpdir}/jingcai-compass-test-snapshots
  security:
    jwt:
      secret: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      issuer: jingcai-compass
      audience: jingcai-compass-admin
      access-token-ttl: 30m
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    bootstrap:
      username: ""
      password: ""
  sporttery:
    provider: stub
  asian-odds:
    provider: stub
  tasks:
    enabled: false
    sporttery-pool:
      enabled: false
      fixed-delay: 15m
      initial-delay: 30s
    asian-odds:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    data-pipeline:
      enabled: false
      fixed-delay: 20m
      initial-delay: 45s
    prediction-lock:
      enabled: false
      fixed-delay: 30s
      initial-delay: 15s
      batch-size: 100
    snapshot-publish:
      enabled: false
      fixed-delay: 5m
      initial-delay: 60s
